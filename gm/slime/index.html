<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15131d">
  <meta name="description" content="SMASH SLIME — 슬라임을 공격하고 스킬을 강화하세요.">
  <title>SMASH SLIME</title>
  <style>
    @font-face {
      font-family: "TtukttakGamja";
      src: url("./assets/fonts/TtukttakGamja.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: "TtukttakGamja", ui-monospace, "Apple SD Gothic Neo", "Malgun Gothic", monospace;
      color: #f5f0ff;
    }

    * { box-sizing: border-box; letter-spacing: 0.05em; }
    body { margin: 0; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    .home {
      --menu-scale: 0.65;
      --button-width-scale: 0.65;
      --menu-gap-scale: 2;
      width: 100%;
      max-width: 835px;
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(48px, 12.3svh, 160px) max(24px, env(safe-area-inset-right)) max(24px, 9svh, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #15131d;
    }

    .home-header { margin-bottom: calc(clamp(40px, 6.8svh, 96px) * var(--menu-scale)); text-align: center; }
    h1 { margin: 0; font-size: calc(clamp(30px, 12vw, 96px) * var(--menu-scale)); font-weight: 400; line-height: 1.2; white-space: nowrap; }
    .main-menu { width: min(calc(84% * var(--menu-scale)), calc(600px * var(--menu-scale))); }
    .menu-panel { display: grid; justify-items: center; gap: calc(clamp(14px, 2.3svh, 40px) * var(--menu-scale) * var(--menu-gap-scale)); }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(56% * var(--button-width-scale));
      min-width: calc(144px * var(--menu-scale) * var(--button-width-scale));
      min-height: calc(clamp(44px, 5svh, 80px) * var(--menu-scale));
      padding: calc(8px * var(--menu-scale)) calc(12px * var(--menu-scale));
      border: calc(2px * var(--menu-scale)) solid #b5a0ed;
      border-radius: 0;
      background: #2d263b;
      color: inherit;
      font: inherit;
      font-size: calc(clamp(18px, 3.7vw, 30px) * var(--menu-scale));
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
    }

    a.menu-button { cursor: pointer; }
    a.menu-button:hover { background: #403451; border-color: #d6c5ff; }
    a.menu-button:active { background: #211a30; }
    a.menu-button:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    .menu-button:disabled { opacity: 1; color: inherit; -webkit-text-fill-color: currentColor; cursor: default; }
    .menu-divider { margin: calc(clamp(20px, 2.8svh, 48px) * var(--menu-scale) * var(--menu-gap-scale)) 0; border: 0; border-top: calc(2px * var(--menu-scale)) dashed #b5a0ed; }
    .login-button { margin-inline: auto; }
    .home-footer { margin-top: auto; padding-top: calc(56px * var(--menu-scale)); color: #88818f; font-size: calc(clamp(12px, 2.7vw, 22px) * var(--menu-scale)); text-align: center; }

    @media (max-height: 650px) {
      .home { padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: max(20px, env(safe-area-inset-bottom)); }
      .home-header { margin-bottom: calc(28px * var(--menu-scale)); }
      h1 { font-size: calc(clamp(30px, 12vw, 64px) * var(--menu-scale)); }
      .menu-panel { gap: calc(12px * var(--menu-scale) * var(--menu-gap-scale)); }
      .menu-divider { margin-block: calc(18px * var(--menu-scale) * var(--menu-gap-scale)); }
      .home-footer { padding-top: calc(24px * var(--menu-scale)); }
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="home-header">
      <h1>SMASH SLIME</h1>
    </header>
    <nav class="main-menu" aria-label="메인 메뉴">
      <div class="menu-panel">
        <a class="menu-button" href="./play.html">시작</a>
        <button class="menu-button" type="button" disabled title="준비 중">순위</button>
        <button class="menu-button" type="button" disabled title="준비 중">도감</button>
        <button class="menu-button" type="button" disabled title="준비 중">설정</button>
      </div>
      <hr class="menu-divider">
      <button class="menu-button login-button" type="button" disabled title="준비 중">로그인</button>
    </nav>
    <footer class="home-footer">play.ducking.kr</footer>
  </main>
</body>
</html>
