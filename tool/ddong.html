<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작은 상자</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050506;color:#d6cbb2;font-family:system-ui,sans-serif}
.stage{--ground:69%;position:relative;isolation:isolate;width:100%;height:100%;min-height:320px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#302d252e,transparent 55%),#050506}
.curtain{position:absolute;inset:0 0 29%;background:repeating-linear-gradient(92deg,#040406 0%,#101014 3%,#19181c 4.5%,#0b0b0e 7%,#030305 10%);mask-image:linear-gradient(#0009,#000 75%,transparent);opacity:.75}
.floor{position:absolute;inset:60% -40% -60%;transform:perspective(500px) rotateX(57deg);transform-origin:center top;background:repeating-linear-gradient(90deg,transparent 0 118px,#030205aa 119px 121px),repeating-linear-gradient(0deg,#231713 0px,#352219 3px,#281b16 6px,#201512 71px,#0c0909 73px,#211713 75px);mask-image:radial-gradient(ellipse at 50% 8%,#000 0%,transparent 60%);opacity:.65}
.beam{position:absolute;left:50%;top:-15%;width:min(900px,115vw);height:calc(var(--ground) + 25%);transform:translateX(-50%);filter:blur(18px);pointer-events:none}
.beam::before{content:'';position:absolute;inset:0;clip-path:polygon(46% 0,51% 0,88% 100%,10% 100%);background:linear-gradient(180deg,#fff3cd02,#eee4ca14 36%,#efe5d11c 74%,#efe5d100);mask-image:linear-gradient(90deg,transparent,#0009 30%,#000 50%,#0009 70%,transparent)}
.pool{position:absolute;left:50%;top:var(--ground);width:min(790px,98vw);height:clamp(130px,23vh,240px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#f5ddb54a 0%,#c8b39127 30%,#b9a58b10 50%,transparent 72%);filter:blur(13px)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 17%,#03030655 65%,#020205dc);pointer-events:none}
.box-anchor{position:absolute;left:50%;top:var(--ground);width:clamp(145px,19vw,195px);aspect-ratio:180/185;transform:translate(-50%,-92.4%)}
.shadow{position:absolute;left:12%;top:83%;width:140%;height:24%;transform:rotate(7deg);border-radius:50%;background:radial-gradient(ellipse,#000c,#0008 36%,transparent 72%);filter:blur(8px)}
.shadow::after{content:'';position:absolute;left:0;top:4%;width:65%;height:50%;background:#000b;filter:blur(3px);border-radius:50%}
.box-anchor button{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:filter .2s}
button:hover{filter:brightness(1.07)}
button:focus-visible{outline:1px solid #f5d985;outline-offset:14px;border-radius:6px}
svg{width:100%;height:100%;overflow:visible}
.lid{transform-origin:78px 26px}
.burst .lid{animation:open .8s cubic-bezier(.2,.7,.3,1)}
.burst svg{animation:bump .4s ease-out}
.hint{position:absolute;top:calc(var(--ground) + 47px);width:100%;margin:10px 0;text-align:center;font-size:12px;font-weight:400;letter-spacing:.3em;color:#b7ab9470;pointer-events:none;transition:opacity .5s}
.counts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;margin:12px 16px 0;font-size:12px;letter-spacing:.03em;color:#b7ab94}
.counts span{white-space:nowrap}
.hint-row{display:flex;align-items:center;justify-content:center;gap:24px}
.collection-open{pointer-events:auto;padding:6px 0;border:0;background:none;color:#b7ab94;font:inherit;letter-spacing:.03em;cursor:pointer}
.collection-open:hover{text-decoration:underline}
.collection{width:min(320px,calc(100vw - 32px));max-height:80vh;margin:auto;padding:20px;border:0;border-radius:10px;background:#fff;color:#202124;box-shadow:0 18px 80px #0008;font-size:12px;overflow:auto}
.collection::backdrop{background:#0009}
.collection header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.collection h2{margin:0;font-size:15px;font-weight:600}
.collection-close{padding:6px 8px;border:0;border-radius:4px;background:none;color:#555;font:inherit;cursor:pointer}
.collection button:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
.collection section{min-height:70px;padding:14px 0;border-bottom:1px solid #f0f0f0}
.collection h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:12px;font-weight:600}
.grade-dot{width:10px;height:10px;border-radius:3px;flex:none}
.collection-items{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0;padding-left:3px;list-style:none}
.collection-items li{display:flex;align-items:center;gap:8px}
.collection-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;object-fit:contain;font-size:18px;line-height:1}
.collection-empty{margin:0;color:#999;font-size:11px}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes open{0%,100%{transform:translateY(0) rotate(0);opacity:1}30%{transform:translate(8px,-68px) rotate(15deg);opacity:1}60%{transform:translate(12px,-48px) rotate(10deg);opacity:.8}}
@keyframes bump{0%,100%{transform:scale(1)}22%{transform:scale(1.025,.97)}60%{transform:scale(.99,1.015)}}
@media(max-width:600px){.beam{width:140vw}.pool{height:130px}.hint{top:calc(var(--ground) + 38px)}}
@media(prefers-reduced-motion:reduce){button{transition:none}.burst .lid,.burst svg{animation:none}}
</style>
</head>
